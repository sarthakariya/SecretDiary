<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Diary Classroom</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Lato:wght@400;700&family=Permanent+Marker&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#e0e7ff] text-slate-800 font-lato h-screen flex flex-col overflow-hidden selection:bg-indigo-500 selection:text-white">

    <!-- Header -->
    <header class="w-full bg-[#f8fafc] border-b border-indigo-200 p-3 shadow-md z-20 flex flex-col md:flex-row justify-between items-center gap-4 relative">
        <div class="flex items-center gap-3">
            <div class="p-2.5 bg-indigo-600 rounded-lg shadow-lg text-white ring-2 ring-indigo-400">
                <i class="fa-solid fa-graduation-cap text-xl"></i>
            </div>
            <div>
                <h1 class="text-2xl font-cinzel font-bold text-indigo-900 tracking-wide drop-shadow-sm">Diary Hunter <span class="text-[10px] align-top bg-indigo-100 text-indigo-700 px-1.5 py-0.5 rounded-full font-sans font-bold border border-indigo-200">PRO</span></h1>
                <p class="text-xs text-slate-500 font-bold uppercase tracking-wider flex items-center gap-1"><i class="fa-solid fa-wifi text-green-500"></i> Class XI Science</p>
            </div>
        </div>
        
        <button id="simulate-btn" class="group relative px-6 py-2.5 bg-indigo-50 border-2 border-indigo-200 text-indigo-700 rounded-xl font-bold shadow-sm hover:shadow-md hover:bg-white transition-all active:scale-95 flex items-center gap-2 overflow-hidden">
            <div class="absolute inset-0 bg-indigo-100 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
            <i class="fa-solid fa-shuffle relative z-10 group-hover:rotate-180 transition-transform duration-500"></i>
            <span class="relative z-10">Simulate Activity</span>
        </button>

        <div class="text-center md:text-right min-w-[140px] bg-white px-3 py-1 rounded-lg border border-indigo-100 shadow-sm">
            <div id="current-time" class="text-2xl font-black text-indigo-950 tracking-tight">00:00:00</div>
            <div id="current-date" class="text-xs text-indigo-400 font-bold uppercase tracking-widest">Loading...</div>
        </div>
    </header>

    <main class="flex-1 flex flex-col md:flex-row h-full overflow-hidden relative bg-[#dbeafe]">
        
        <!-- Classroom Area -->
        <section class="relative flex-1 p-4 md:p-8 overflow-hidden flex flex-col items-center justify-center z-10 bg-[#e2e8f0]">
            
            <!-- Room Container -->
            <div class="room-container w-full max-w-5xl aspect-video bg-[#fdfbf7] rounded-xl border-4 border-[#cbd5e1] p-8 relative shadow-[0_20px_50px_rgba(0,0,0,0.2)] overflow-hidden flex flex-col perspective-container">
                
                <!-- Wall Color -->
                <div class="absolute inset-0 bg-[#f1f5f9] z-0"></div>
                <!-- Floor Texture Overlay -->
                <div class="absolute bottom-0 h-2/3 w-full bg-[#e2e8f0] border-t-2 border-[#cbd5e1] z-0">
                    <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/wood-pattern.png')] opacity-10"></div>
                </div>

                <!-- Windows (Right Wall) -->
                <div id="windows-group" class="absolute right-0 top-1/4 bottom-1/4 w-4 flex flex-col justify-between items-end gap-6 z-0 cursor-pointer group">
                    <div class="window bg-sky-200 border-l-4 border-y-4 border-white h-24 w-full shadow-lg relative overflow-hidden backdrop-blur-sm group-hover:bg-sky-100 transition-colors">
                        <div class="sun-beam absolute top-0 right-0 w-full h-full bg-gradient-to-l from-yellow-100/40 to-transparent"></div>
                    </div>
                    <div class="window bg-sky-200 border-l-4 border-y-4 border-white h-24 w-full shadow-lg relative overflow-hidden backdrop-blur-sm group-hover:bg-sky-100 transition-colors">
                        <div class="sun-beam absolute top-0 right-0 w-full h-full bg-gradient-to-l from-yellow-100/40 to-transparent"></div>
                    </div>
                    <div class="window bg-sky-200 border-l-4 border-y-4 border-white h-24 w-full shadow-lg relative overflow-hidden backdrop-blur-sm group-hover:bg-sky-100 transition-colors">
                        <div class="sun-beam absolute top-0 right-0 w-full h-full bg-gradient-to-l from-yellow-100/40 to-transparent"></div>
                    </div>
                </div>

                <!-- Top Wall: Door, Clock, Teacher -->
                <div class="flex justify-between items-start mb-8 relative z-10 w-full h-32">
                    
                    <!-- Door -->
                    <div class="door-area relative group">
                        <div class="w-3 h-36 bg-slate-300 absolute -left-4 top-0 border-r border-slate-400"></div>
                        <div class="door w-24 h-36 bg-[#5D4037] rounded-t-md border-2 border-[#3e2723] shadow-2xl transform origin-left transition-all duration-700 group-hover:rotate-y-12 flex items-center justify-center relative cursor-pointer overflow-hidden">
                            <!-- Door Window -->
                            <div class="w-12 h-16 bg-sky-900/40 border-2 border-[#3e2723]/50 mb-8 rounded-sm backdrop-blur-sm shadow-inner relative">
                                <div class="absolute inset-0 bg-gradient-to-tr from-white/10 to-transparent"></div>
                            </div>
                            <div class="w-2 h-6 bg-yellow-500 rounded-full absolute right-2 top-1/2 translate-y-4 shadow-sm border border-yellow-700"></div>
                            
                            <!-- Class Plate -->
                            <div class="absolute top-3 bg-[#b8860b] px-3 py-1 shadow-md border border-[#8b6508] rounded-sm">
                                <span class="block text-[9px] font-black text-white uppercase tracking-tighter text-center leading-none">XI-SCI</span>
                            </div>
                        </div>
                    </div>

                    <!-- Enhanced Analog Clock -->
                    <div id="analog-clock-container" class="absolute left-1/2 -translate-x-1/2 top-0 flex flex-col items-center cursor-pointer group">
                        <div class="analog-clock w-28 h-28 bg-white rounded-full border-[8px] border-slate-800 shadow-2xl relative flex items-center justify-center transition-transform duration-500 group-hover:scale-105">
                            <!-- Glass Reflection -->
                            <div class="absolute inset-0 rounded-full bg-gradient-to-tr from-transparent via-white/40 to-transparent z-20 pointer-events-none"></div>
                            
                            <div class="clock-face w-full h-full relative z-10">
                                <!-- Numbers -->
                                <span class="clock-num absolute top-1 left-1/2 -translate-x-1/2 text-[10px] font-black text-slate-900">12</span>
                                <span class="clock-num absolute bottom-1 left-1/2 -translate-x-1/2 text-[10px] font-black text-slate-900">6</span>
                                <span class="clock-num absolute left-1 top-1/2 -translate-y-1/2 text-[10px] font-black text-slate-900">9</span>
                                <span class="clock-num absolute right-1 top-1/2 -translate-y-1/2 text-[10px] font-black text-slate-900">3</span>

                                <div class="hand hour-hand absolute bg-slate-900 w-1.5 h-7 top-6 left-1/2 -translate-x-1/2 origin-bottom rounded-full shadow-sm"></div>
                                <div class="hand minute-hand absolute bg-slate-600 w-1 h-9 top-4 left-1/2 -translate-x-1/2 origin-bottom rounded-full shadow-sm"></div>
                                <div class="hand second-hand absolute bg-red-600 w-0.5 h-10 top-3 left-1/2 -translate-x-1/2 origin-bottom rounded-full z-10"></div>
                                <div class="center-dot absolute w-3 h-3 bg-slate-800 rounded-full top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 shadow-sm border-2 border-white z-10"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Teacher's Desk -->
                    <div class="teacher-area">
                        <div class="teacher-desk w-64 h-28 bg-[#5D4037] rounded-xl shadow-xl border-t border-[#8D6E63] relative flex items-center justify-center group z-10">
                            <!-- Desk Texture -->
                            <div class="absolute inset-0 rounded-xl bg-[url('https://www.transparenttextures.com/patterns/wood-pattern.png')] opacity-40"></div>
                            
                            <!-- Name Plate -->
                            <div class="absolute -top-3 bg-gradient-to-r from-amber-700 to-amber-600 text-white text-[10px] px-3 py-1 rounded-sm shadow-lg font-bold border-b-2 border-amber-900 tracking-wider">
                                MR. ANDERSON
                            </div>
                            
                            <!-- Props -->
                            <div class="absolute top-4 right-8 w-10 h-12 bg-white rounded-sm shadow-sm transform rotate-6 border border-slate-200 flex flex-col p-1 gap-1">
                                <div class="h-1 bg-slate-300 w-full"></div>
                                <div class="h-1 bg-slate-300 w-2/3"></div>
                            </div>
                            
                            <!-- Laptop -->
                            <div id="teacher-laptop" class="absolute bottom-6 left-8 w-20 h-14 cursor-pointer transform hover:-translate-y-1 transition-transform">
                                <div class="absolute bottom-0 w-20 h-2 bg-slate-800 rounded-b-md"></div> <!-- Base -->
                                <div class="absolute bottom-2 w-18 h-12 bg-slate-700 rounded-t-md left-1 border-4 border-slate-800 flex items-center justify-center overflow-hidden laptop-screen">
                                    <i class="fa-brands fa-apple text-white opacity-80 text-lg"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Classroom Floor Area -->
                <div class="flex-1 flex justify-center items-center gap-16 relative z-10 perspective-floor">
                    
                    <!-- Left Row -->
                    <div class="grid grid-cols-2 gap-x-8 gap-y-6" id="row-left">
                        <!-- JS Generated -->
                    </div>

                    <!-- Walkway Carpet -->
                    <div class="h-full w-24 flex items-center justify-center relative">
                        <div class="w-20 h-full bg-red-800/10 border-x-2 border-dashed border-red-900/20"></div>
                    </div>

                    <!-- Right Row -->
                    <div class="grid grid-cols-2 gap-x-8 gap-y-6" id="row-right">
                        <!-- JS Generated -->
                    </div>
                </div>
            </div>
        </section>

        <!-- Modern Sidebar -->
        <aside class="w-full md:w-80 bg-white border-l border-indigo-100 flex flex-col shadow-2xl z-30 h-1/3 md:h-auto">
            <div class="p-4 border-b border-indigo-50 flex justify-between items-center bg-indigo-50/50">
                <h2 class="font-bold text-indigo-900 uppercase tracking-wider text-xs flex items-center">
                    <i class="fa-solid fa-list-check mr-2 text-indigo-500"></i>Activity Log
                </h2>
                <div class="flex gap-1 items-center bg-white px-2 py-0.5 rounded-full border border-indigo-100 shadow-sm">
                    <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
                    <span class="text-[10px] text-indigo-400 font-bold">LIVE</span>
                </div>
            </div>
            
            <div class="flex-1 overflow-y-auto p-4 space-y-3 custom-scrollbar bg-slate-50" id="history-log">
                <!-- JS Generated -->
            </div>

            <!-- Action Area -->
            <div class="p-4 border-t border-indigo-100 bg-white shadow-[0_-5px_20px_rgba(0,0,0,0.02)] flex flex-col gap-3">
                
                <!-- Take Button -->
                <button id="take-btn" class="w-full py-3 rounded-xl font-bold text-white shadow-md transition-all transform active:scale-95 flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed disabled:shadow-none bg-indigo-600 hover:bg-indigo-700 border-b-4 border-indigo-800">
                    <i class="fa-solid fa-hand-holding"></i>
                    I HAVE TAKEN THE DIARY
                </button>

                <!-- Inventory Slot -->
                <div id="inventory-slot" class="w-full h-20 rounded-xl flex items-center justify-center gap-3 transition-all duration-300 shadow-inner border-2 bg-slate-100 border-slate-200">
                    <!-- JS Updates this -->
                </div>
            </div>
        </aside>

    </main>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed top-24 right-6 z-50 flex flex-col gap-3 pointer-events-none"></div>

    <script src="script.js"></script>
</body>
</html>
