<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Diary Classroom</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Cinzel:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#f3f4f6] text-slate-800 font-inter h-screen flex flex-col overflow-hidden selection:bg-indigo-500 selection:text-white relative">

    <!-- Ambient Background Blobs -->
    <div class="fixed top-[-10%] left-[-10%] w-[40%] h-[40%] bg-indigo-300/30 rounded-full blur-3xl pointer-events-none z-0 mix-blend-multiply animate-blob"></div>
    <div class="fixed top-[10%] right-[-10%] w-[35%] h-[35%] bg-purple-300/30 rounded-full blur-3xl pointer-events-none z-0 mix-blend-multiply animate-blob animation-delay-2000"></div>
    <div class="fixed bottom-[-10%] left-[20%] w-[40%] h-[40%] bg-emerald-300/30 rounded-full blur-3xl pointer-events-none z-0 mix-blend-multiply animate-blob animation-delay-4000"></div>

    <!-- Glass Header -->
    <header class="w-full h-20 glass-panel border-b border-white/40 px-6 z-50 flex justify-between items-center relative">
        <div class="flex items-center gap-4">
            <div class="relative group cursor-default">
                <div class="absolute -inset-1 bg-gradient-to-r from-indigo-600 to-purple-600 rounded-lg blur opacity-25 group-hover:opacity-50 transition duration-1000 group-hover:duration-200"></div>
                <div class="relative p-3 bg-white rounded-lg shadow-sm border border-slate-100 ring-1 ring-slate-900/5">
                    <i class="fa-solid fa-graduation-cap text-2xl text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600"></i>
                </div>
            </div>
            <div>
                <h1 class="text-2xl font-space font-bold text-slate-800 tracking-tight leading-none">Diary Hunter <span class="text-[10px] align-super bg-black text-white px-2 py-0.5 rounded-full font-inter font-medium tracking-widest">OS</span></h1>
                <div class="flex items-center gap-2 mt-1">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.6)]"></span>
                    <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">Class XI Science • Live</p>
                </div>
            </div>
        </div>
        
        <div class="flex items-center gap-6">
            <button id="simulate-btn" class="group relative px-6 py-2.5 rounded-xl font-semibold text-sm text-slate-600 bg-white/50 border border-white/60 shadow-sm hover:shadow-md hover:bg-white hover:text-indigo-600 transition-all active:scale-95 flex items-center gap-2 overflow-hidden backdrop-blur-sm">
                <span class="absolute inset-0 w-full h-full bg-gradient-to-r from-indigo-50 to-purple-50 opacity-0 group-hover:opacity-100 transition-opacity"></span>
                <i class="fa-solid fa-shuffle relative z-10 text-xs transition-transform group-hover:rotate-180"></i>
                <span class="relative z-10">Simulate Event</span>
            </button>

            <div class="hidden md:flex flex-col items-end">
                <div id="current-time" class="text-3xl font-space font-bold text-slate-800 leading-none tracking-tight">00:00</div>
                <div id="current-date" class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-0.5">Loading System...</div>
            </div>
        </div>
    </header>

    <main class="flex-1 flex flex-col md:flex-row h-full overflow-hidden relative z-10 p-4 md:p-6 gap-6">
        
        <!-- Classroom Viewport -->
        <section class="flex-1 relative flex flex-col items-center justify-center">
            
            <!-- Architectural Container -->
            <div class="room-chassis w-full max-w-6xl aspect-[16/9] bg-white rounded-3xl shadow-2xl overflow-hidden flex flex-col relative border border-white/60">
                
                <!-- Lighting & Atmosphere -->
                <div class="absolute inset-0 bg-gradient-to-b from-slate-50 via-slate-100 to-slate-200 z-0"></div>
                <div class="absolute top-0 left-0 w-full h-1/3 bg-gradient-to-b from-slate-200/50 to-transparent z-0 pointer-events-none"></div>

                <!-- Windows (Right Wall) -->
                <div id="windows-group" class="absolute right-0 top-[20%] bottom-[20%] w-16 flex flex-col justify-between items-end z-10 perspective-right">
                    <div class="window-pane group">
                        <div class="sun-shaft"></div>
                    </div>
                    <div class="window-pane group">
                        <div class="sun-shaft"></div>
                    </div>
                    <div class="window-pane group">
                        <div class="sun-shaft"></div>
                    </div>
                </div>

                <!-- Back Wall Elements -->
                <div class="relative z-10 w-full h-40 flex justify-between items-end px-12 pb-4 border-b border-slate-300/50 bg-gradient-to-b from-slate-100 to-slate-200/80">
                    
                    <!-- Door -->
                    <div class="door-frame relative group cursor-pointer perspective-left">
                        <div class="w-28 h-36 bg-[#2d3748] rounded-t-lg border border-[#1a202c] shadow-2xl relative overflow-hidden group-hover:translate-x-1 transition-transform">
                            <!-- Frosted Window -->
                            <div class="absolute top-4 left-1/2 -translate-x-1/2 w-12 h-16 bg-blue-100/10 backdrop-blur-sm border border-white/10 rounded-sm"></div>
                            <!-- Handle -->
                            <div class="absolute top-1/2 right-3 w-2 h-6 bg-gradient-to-b from-amber-300 to-amber-600 rounded-full shadow-lg"></div>
                            <!-- Sign -->
                            <div class="absolute top-24 left-1/2 -translate-x-1/2 bg-black/40 px-3 py-1 border border-white/10 rounded backdrop-blur-md">
                                <span class="text-[8px] font-bold text-white/80 uppercase tracking-widest">XI-SCI</span>
                            </div>
                        </div>
                    </div>

                    <!-- Clock -->
                    <div id="analog-clock-container" class="absolute left-1/2 top-8 -translate-x-1/2 group cursor-pointer">
                        <div class="w-32 h-32 bg-white rounded-full shadow-[0_10px_30px_rgba(0,0,0,0.1)] border-4 border-slate-100 flex items-center justify-center relative transition-transform group-hover:scale-105">
                            <!-- Markers -->
                            <div class="absolute inset-2 border-2 border-slate-100 rounded-full"></div>
                            <div class="absolute top-3 text-xs font-bold text-slate-400">12</div>
                            <div class="absolute bottom-3 text-xs font-bold text-slate-400">6</div>
                            <div class="absolute left-3 text-xs font-bold text-slate-400">9</div>
                            <div class="absolute right-3 text-xs font-bold text-slate-400">3</div>
                            <!-- Hands -->
                            <div class="hand hour-hand absolute w-1.5 h-8 bg-slate-800 rounded-full top-8 left-1/2 -translate-x-1/2 origin-bottom shadow-sm"></div>
                            <div class="hand minute-hand absolute w-1 h-10 bg-slate-500 rounded-full top-6 left-1/2 -translate-x-1/2 origin-bottom shadow-sm"></div>
                            <div class="hand second-hand absolute w-0.5 h-12 bg-rose-500 rounded-full top-4 left-1/2 -translate-x-1/2 origin-bottom"></div>
                            <div class="w-3 h-3 bg-white border-2 border-slate-800 rounded-full absolute z-20 shadow-sm"></div>
                        </div>
                    </div>

                    <!-- Teacher Desk -->
                    <div class="teacher-setup relative group">
                        <div class="w-64 h-24 bg-gradient-to-r from-[#5D4037] to-[#4E342E] rounded-lg shadow-xl relative z-20 flex items-center justify-center border-t border-[#8D6E63]">
                            <div class="absolute -top-6 left-8 w-20 h-16 bg-[#1a202c] rounded-t-lg border-x-4 border-t-4 border-[#2d3748] flex items-center justify-center relative laptop-lid transition-transform group-hover:translate-y-[-2px]">
                                <i class="fa-brands fa-apple text-white/30 text-2xl"></i>
                                <div id="teacher-laptop" class="absolute inset-0 opacity-0 cursor-pointer"></div>
                            </div>
                            <span class="absolute bottom-2 right-4 text-[10px] text-white/30 font-space uppercase tracking-widest font-bold">Anderson</span>
                        </div>
                        <!-- Legs -->
                        <div class="absolute top-24 left-4 w-2 h-10 bg-slate-800"></div>
                        <div class="absolute top-24 right-4 w-2 h-10 bg-slate-800"></div>
                    </div>
                </div>

                <!-- Floor Area -->
                <div class="flex-1 bg-[#e2e8f0] relative overflow-hidden perspective-floor flex justify-center py-10">
                    <!-- Floor Grid -->
                    <div class="absolute inset-0 bg-[linear-gradient(45deg,#cbd5e1_1px,transparent_1px),linear-gradient(-45deg,#cbd5e1_1px,transparent_1px)] bg-[size:40px_40px] opacity-20 transform scale-y-50 origin-top"></div>
                    
                    <div class="flex gap-24 relative z-10 w-full max-w-4xl px-8">
                        <!-- Left Row -->
                        <div class="flex-1 grid grid-cols-2 gap-x-12 gap-y-10" id="row-left">
                            <!-- Generated -->
                        </div>

                        <!-- Walkway -->
                        <div class="w-32 relative flex justify-center">
                            <div class="h-full w-full border-x border-dashed border-slate-300/50 bg-slate-50/30"></div>
                        </div>

                        <!-- Right Row -->
                        <div class="flex-1 grid grid-cols-2 gap-x-12 gap-y-10" id="row-right">
                            <!-- Generated -->
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Sidebar / Command Center -->
        <aside class="w-full md:w-[350px] flex flex-col gap-6 z-20">
            
            <!-- Inventory Card -->
            <div class="glass-panel rounded-3xl p-1 shadow-xl border border-white/50 relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 to-purple-500"></div>
                <div class="p-5">
                    <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4 flex justify-between">
                        Current Status
                        <i class="fa-solid fa-fingerprint opacity-50"></i>
                    </h2>
                    
                    <div id="inventory-slot" class="w-full h-24 rounded-2xl flex items-center justify-center gap-4 transition-all duration-300 border border-slate-200 bg-slate-50/50">
                        <!-- JS Content -->
                    </div>

                    <button id="take-btn" class="mt-4 w-full py-4 rounded-xl font-bold text-sm tracking-wide text-white shadow-lg shadow-indigo-500/30 transition-all transform active:scale-[0.98] flex items-center justify-center gap-3 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 disabled:opacity-50 disabled:cursor-not-allowed disabled:shadow-none overflow-hidden relative group">
                        <span class="absolute inset-0 w-full h-full bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-out"></span>
                        <i class="fa-solid fa-hand-holding relative z-10"></i>
                        <span class="relative z-10">CLAIM DIARY</span>
                    </button>
                </div>
            </div>

            <!-- History Log -->
            <div class="glass-panel flex-1 rounded-3xl shadow-xl border border-white/50 flex flex-col overflow-hidden min-h-[300px]">
                <div class="p-4 border-b border-slate-100 bg-white/40 backdrop-blur-md flex justify-between items-center">
                    <h2 class="text-xs font-bold text-slate-600 uppercase tracking-widest">
                        Activity Feed
                    </h2>
                    <span class="flex h-2 w-2 relative">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                    </span>
                </div>
                <div class="flex-1 overflow-y-auto p-4 space-y-3 custom-scrollbar bg-slate-50/30" id="history-log">
                    <!-- Logs -->
                </div>
            </div>

        </aside>

    </main>

    <!-- Notification Toast -->
    <div id="toast-container" class="fixed top-24 right-6 z-50 flex flex-col gap-4 pointer-events-none"></div>

    <script src="script.js"></script>
</body>
</html>
