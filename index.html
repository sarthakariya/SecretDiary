<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Diary Classroom</title>
    <!-- Tailwind CSS for layout and utility classes -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 font-inter h-screen flex flex-col overflow-hidden selection:bg-emerald-500 selection:text-white">

    <!-- Header / Info Bar -->
    <header class="w-full bg-slate-800 border-b border-slate-700 p-4 flex flex-col md:flex-row justify-between items-center shadow-md z-10 gap-4">
        <div>
            <h1 class="text-xl font-bold text-emerald-400"><i class="fa-solid fa-book-journal-whills mr-2"></i>Secret Diary Hunter</h1>
            <p class="text-xs text-slate-400">Click a bench to hide or retrieve a diary</p>
        </div>
        
        <!-- Action Button for Simulation -->
        <button id="simulate-btn" class="bg-amber-600 hover:bg-amber-500 text-white font-semibold py-2 px-4 rounded shadow-lg transition-transform transform active:scale-95 flex items-center text-sm border-b-4 border-amber-800 hover:border-amber-700">
            <i class="fa-solid fa-users-viewfinder mr-2"></i> Simulate Class Activity
        </button>

        <div class="text-center md:text-right">
            <div id="current-time" class="text-lg font-mono font-semibold text-white">00:00:00</div>
            <div id="current-date" class="text-sm text-slate-400">Loading date...</div>
        </div>
    </header>

    <main class="flex-1 flex flex-col md:flex-row h-full overflow-hidden">
        
        <!-- Classroom Area (Left/Center) -->
        <section class="relative flex-1 bg-slate-900 p-6 overflow-auto flex flex-col items-center justify-start">
            
            <!-- Room Container -->
            <div class="room-container w-full max-w-4xl bg-slate-800 rounded-xl border-4 border-slate-700 p-6 relative shadow-2xl">
                
                <!-- Room Top: Door & Teacher -->
                <div class="flex justify-between items-start mb-12 relative h-32">
                    
                    <!-- Door (Top Left) -->
                    <div class="door-area relative">
                        <div class="w-4 h-32 bg-slate-900 absolute -left-6 top-0 border-r-2 border-slate-600"></div>
                        <div class="door w-24 h-4 bg-amber-700 rounded-sm shadow-lg transform origin-left transition-transform duration-500 hover:rotate-45 cursor-pointer flex items-center justify-center relative top-0 left-0">
                            <span class="text-[10px] text-amber-200 uppercase font-bold tracking-widest absolute -top-5">Entry</span>
                            <div class="w-8 h-1 bg-amber-900 rounded-full opacity-50"></div>
                        </div>
                        <div class="w-16 h-16 bg-slate-700/50 absolute top-4 left-0 rounded-full blur-xl pointer-events-none"></div>
                    </div>

                    <!-- Teacher's Table (Top Right) -->
                    <div class="teacher-area flex flex-col items-end">
                        <div class="teacher-desk w-48 h-20 bg-amber-800 rounded-lg shadow-xl border border-amber-900 relative flex items-center justify-center">
                            <span class="text-amber-200/50 text-xs font-bold uppercase tracking-wider">Teacher's Desk</span>
                            <div class="absolute -top-3 right-4 w-8 h-8 bg-slate-700 rounded-full flex items-center justify-center border border-slate-600">
                                <i class="fa-solid fa-mug-hot text-slate-400 text-xs"></i>
                            </div>
                            <!-- Laptop -->
                            <div class="absolute top-4 left-4 w-12 h-10 bg-slate-600 rounded-sm transform rotate-6 border-b-2 border-slate-900"></div>
                        </div>
                    </div>
                </div>

                <!-- Seating Arrangement -->
                <div class="flex justify-center gap-16 md:gap-32">
                    
                    <!-- Left Row (Row 1) -->
                    <div class="flex flex-col gap-4" id="row-left">
                        <!-- Benches generated by JS -->
                    </div>

                    <!-- Walkway -->
                    <div class="hidden md:flex items-center justify-center">
                        <div class="h-full w-px bg-slate-700 dashed-line"></div>
                    </div>

                    <!-- Right Row (Row 2) -->
                    <div class="flex flex-col gap-4" id="row-right">
                        <!-- Benches generated by JS -->
                    </div>

                </div>
            </div>

            <!-- Floor Decoration -->
            <div class="mt-8 text-slate-600 text-sm">
                <i class="fa-solid fa-arrow-up animate-bounce"></i> Front of Class
            </div>
        </section>

        <!-- Sidebar: History Log -->
        <aside class="w-full md:w-80 bg-slate-800 border-l border-slate-700 flex flex-col shadow-xl z-20 h-1/3 md:h-auto">
            <div class="p-4 border-b border-slate-700 bg-slate-800 sticky top-0">
                <h2 class="font-bold text-slate-200"><i class="fa-solid fa-clock-rotate-left mr-2"></i>Activity Log</h2>
            </div>
            <div id="history-log" class="flex-1 overflow-y-auto p-4 space-y-3">
                <!-- Log items generated by JS -->
                <div class="text-center text-slate-500 text-sm italic mt-10">No activity recorded yet...</div>
            </div>
        </aside>

    </main>

    <!-- Notifications Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script src="script.js"></script>
</body>
</html>
