<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Diary Classroom</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-exo h-screen flex flex-col overflow-hidden selection:bg-cyan-500 selection:text-white">

    <!-- Header -->
    <header class="w-full bg-slate-900/80 backdrop-blur-md border-b border-white/10 p-4 flex flex-col md:flex-row justify-between items-center shadow-[0_4px_30px_rgba(0,0,0,0.5)] z-20 gap-4 relative">
        <div class="flex items-center gap-3">
            <div class="p-2 bg-cyan-500/10 rounded-lg border border-cyan-500/20 shadow-[0_0_15px_rgba(6,182,212,0.1)]">
                <i class="fa-solid fa-book-journal-whills text-2xl text-cyan-400"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-emerald-400 tracking-wide uppercase">Diary Hunter <span class="text-[10px] bg-slate-800 px-1 py-0.5 rounded text-slate-400 ml-1">v2.1</span></h1>
                <p class="text-xs text-slate-400 font-mono" id="status-indicator">System Status: <span class="text-emerald-400">Online</span></p>
            </div>
        </div>
        
        <button id="simulate-btn" class="group relative px-6 py-2 bg-gradient-to-r from-amber-600 to-orange-600 rounded-full font-bold text-white shadow-lg overflow-hidden transition-all hover:scale-105 active:scale-95 border border-orange-400/30">
            <div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
            <span class="relative flex items-center gap-2">
                <i class="fa-solid fa-users-viewfinder"></i> Simulate Activity
            </span>
        </button>

        <div class="text-center md:text-right bg-black/20 p-2 rounded-lg border border-white/5 min-w-[140px]">
            <div id="current-time" class="text-xl font-mono font-bold text-cyan-100 drop-shadow-[0_0_5px_rgba(34,211,238,0.5)]">00:00:00</div>
            <div id="current-date" class="text-[10px] text-slate-400 uppercase tracking-widest">Loading...</div>
        </div>
    </header>

    <main class="flex-1 flex flex-col md:flex-row h-full overflow-hidden relative">
        <!-- Background Grid -->
        <div class="absolute inset-0 grid-bg opacity-20 pointer-events-none z-0"></div>

        <!-- Classroom Area -->
        <section class="relative flex-1 p-4 md:p-8 overflow-hidden flex flex-col items-center justify-center z-10">
            
            <!-- Room Container -->
            <div class="room-container w-full max-w-5xl aspect-video bg-slate-900/60 backdrop-blur-sm rounded-2xl border border-white/10 p-8 relative shadow-2xl overflow-hidden flex flex-col">
                
                <!-- Windows (Right Wall) (Easter Egg ID Added) -->
                <div id="windows-group" class="absolute right-0 top-1/4 bottom-1/4 w-2 flex flex-col justify-between items-end gap-4 z-0 cursor-pointer group">
                    <div class="window-glow transition-opacity duration-500"></div>
                    <div class="window-glow transition-opacity duration-500"></div>
                    <div class="window-glow transition-opacity duration-500"></div>
                </div>

                <!-- Top Wall: Door, Clock, Teacher -->
                <div class="flex justify-between items-start mb-8 relative z-10 w-full h-32">
                    
                    <!-- Door (Updated Label) -->
                    <div class="door-area relative group perspective-1000">
                        <div class="w-2 h-32 bg-slate-800 absolute -left-4 top-0 border-r border-slate-600"></div>
                        <div class="door w-24 h-32 bg-gradient-to-br from-slate-700 to-slate-800 rounded-sm border border-slate-600 shadow-xl transform origin-left transition-all duration-700 group-hover:rotate-y-45 flex items-center justify-center relative cursor-pointer overflow-hidden">
                            <div class="absolute inset-0 bg-noise opacity-10"></div>
                            <div class="w-2 h-8 bg-slate-900/50 rounded-full absolute right-2 top-1/2 -translate-y-1/2 border border-slate-500/30"></div>
                            <!-- Class Label Updated -->
                            <div class="absolute top-4 border border-slate-500/20 px-2 py-1 rounded bg-black/20 text-center">
                                <span class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest">Class</span>
                                <span class="block text-xs font-bold text-cyan-500 uppercase tracking-widest">XI Science</span>
                            </div>
                        </div>
                    </div>

                    <!-- Analog Clock (Easter Egg ID Added) -->
                    <div id="analog-clock-container" class="absolute left-1/2 -translate-x-1/2 top-0 flex flex-col items-center cursor-pointer transition-transform duration-700 active:rotate-[360deg]">
                        <div class="analog-clock w-24 h-24 bg-slate-800 rounded-full border-4 border-slate-700 shadow-lg relative flex items-center justify-center">
                            <div class="clock-face w-full h-full relative">
                                <div class="hand hour-hand absolute bg-white w-1 h-6 top-6 left-1/2 -translate-x-1/2 origin-bottom rounded-full"></div>
                                <div class="hand minute-hand absolute bg-slate-400 w-0.5 h-8 top-4 left-1/2 -translate-x-1/2 origin-bottom rounded-full"></div>
                                <div class="hand second-hand absolute bg-red-500 w-0.5 h-9 top-3 left-1/2 -translate-x-1/2 origin-bottom rounded-full"></div>
                                <div class="center-dot absolute w-2 h-2 bg-white rounded-full top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 shadow-sm"></div>
                                <!-- Markers -->
                                <div class="absolute w-1 h-2 bg-slate-500 top-1 left-1/2 -translate-x-1/2"></div>
                                <div class="absolute w-1 h-2 bg-slate-500 bottom-1 left-1/2 -translate-x-1/2"></div>
                                <div class="absolute w-2 h-1 bg-slate-500 left-1 top-1/2 -translate-y-1/2"></div>
                                <div class="absolute w-2 h-1 bg-slate-500 right-1 top-1/2 -translate-y-1/2"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Teacher's Desk (Bigger) -->
                    <div class="teacher-area">
                        <div class="teacher-desk w-64 h-28 bg-gradient-to-b from-[#3E2723] to-[#281815] rounded-xl shadow-[0_10px_20px_rgba(0,0,0,0.4)] border-t border-white/5 relative flex items-center justify-center group">
                            <!-- Desk Surface details -->
                            <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/wood-pattern.png')] opacity-30"></div>
                            
                            <!-- Name Plate -->
                            <div class="absolute -top-4 bg-black/60 backdrop-blur text-xs px-3 py-1 rounded border border-white/10 text-amber-500 font-bold shadow-lg">
                                MR. ANDERSON
                            </div>
                            
                            <!-- Items -->
                            <div class="absolute top-4 right-6 w-8 h-10 bg-white/5 rounded border border-white/10 flex items-center justify-center transform rotate-12 shadow-sm hover:rotate-45 transition-transform cursor-help" title="Grade Book">
                                <div class="w-6 h-8 bg-white/80 scale-90"></div> 
                            </div>
                            <div class="absolute top-8 left-8 w-10 h-10 bg-slate-800 rounded-full border border-slate-700 flex items-center justify-center shadow-md">
                                <i class="fa-solid fa-mug-hot text-slate-500 text-sm"></i>
                            </div>
                            <!-- Laptop Open (Easter Egg ID) -->
                            <div id="teacher-laptop" class="absolute bottom-4 w-24 h-16 bg-slate-700 rounded-md transform -translate-x-4 skew-x-6 border-b-2 border-black flex items-center justify-center cursor-alias">
                                <div class="w-20 h-12 bg-black rounded-sm relative overflow-hidden group-laptop">
                                    <div class="w-full h-full bg-cyan-500/20 animate-pulse laptop-screen"></div>
                                    <i class="fa-brands fa-apple text-white/50 absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-lg hover:text-white transition-colors"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Classroom Floor -->
                <div class="flex-1 flex justify-center items-center gap-12 md:gap-24 relative z-10">
                    
                    <!-- Left Row -->
                    <div class="grid grid-cols-2 gap-x-6 gap-y-4" id="row-left">
                        <!-- JS Generated -->
                    </div>

                    <!-- Walkway -->
                    <div class="h-full w-24 flex items-center justify-center relative">
                        <!-- Rug / Path -->
                        <div class="w-full h-full bg-gradient-to-b from-transparent via-slate-800/30 to-transparent border-x border-dashed border-white/5"></div>
                    </div>

                    <!-- Right Row -->
                    <div class="grid grid-cols-2 gap-x-6 gap-y-4" id="row-right">
                        <!-- JS Generated -->
                    </div>
                </div>

                <!-- Windows Light Effect Overlay -->
                <div class="absolute right-0 top-0 bottom-0 w-64 bg-gradient-to-l from-amber-100/5 to-transparent pointer-events-none z-20 mix-blend-overlay"></div>

            </div>
        </section>

        <!-- Sidebar -->
        <aside class="w-full md:w-96 bg-slate-900/95 backdrop-blur-xl border-l border-white/10 flex flex-col shadow-2xl z-30 h-1/3 md:h-auto">
            <div class="p-4 border-b border-white/10 flex justify-between items-center bg-slate-800/50">
                <h2 class="font-bold text-cyan-400 font-exo uppercase tracking-wider text-sm">
                    <i class="fa-solid fa-clock-rotate-left mr-2"></i>Event Log
                </h2>
                <span class="text-[10px] bg-cyan-900/50 text-cyan-200 px-2 py-0.5 rounded border border-cyan-500/20">Live Feed</span>
            </div>
            
            <div class="flex-1 overflow-y-auto p-4 space-y-3 custom-scrollbar relative" id="history-log">
                <!-- JS Generated -->
            </div>

            <!-- Held Item Status / ACTION BUTTON AREA -->
            <div class="p-4 border-t border-white/10 bg-slate-800/50">
                <div class="text-[10px] text-slate-500 uppercase tracking-widest mb-2">Current Status</div>
                <div id="inventory-slot" class="w-full h-20 bg-slate-950 rounded-lg border border-slate-700 flex items-center justify-center gap-3 transition-all duration-300">
                    <!-- JS Updates this to act as a button/status -->
                    <span class="text-slate-600 italic text-sm">Empty</span>
                </div>
            </div>
        </aside>

    </main>

    <!-- Notifications -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 pointer-events-none"></div>

    <script src="script.js"></script>
</body>
</html>
